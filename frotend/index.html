<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&K Training - Tienda de Suplementos</title>
    <style>
        /* Estilos generales con fondo negro y acentos rojos */
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #1a0000 0%, #000000 100%);
            border-bottom: 3px solid #e50914;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Estilo para el logo circular */
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e50914;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
        }

        h1 {
            color: #e50914;
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: #bbbbbb;
            margin: 5px 0 0 0;
            font-size: 1.1rem;
        }

        /* Contenedor del catálogo */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            border-left: 4px solid #e50914;
            padding-left: 10px;
            color: #ffffff;
        }

        #productos-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <!-- Aquí cargamos tu logo.png -->
            <img src="logo.png" alt="Logo D&K Training" class="logo">
            <div>
                <h1>D&K Training</h1>
                <p class="subtitle">Nutrición y suplementación de alto rendimiento</p>
            </div>
        </div>
    </header>

    <div class="container">
        <h2>Catálogo de Productos</h2>
        <div id="productos-container">
            <p>Cargando productos...</p>
        </div>

        <!-- CONTENEDOR DEL CARRITO DE COMPRAS -->
        <div id="carrito-contenedor" style="background: #161616; color: white; padding: 20px; border-radius: 8px; margin: 40px auto 20px auto; border: 1px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            <h2 style="margin-top: 0; border-left: 4px solid #25d366; padding-left: 10px;">🛒 Tu Carrito de Compras</h2>
            <div id="lista-carrito">
                <p style="color: #888;">El carrito está vacío.</p>
            </div>
            <h3 style="margin-top: 20px;">Total: $<span id="total-carrito">0</span></h3>
            
            <div style="margin-top: 15px;">
                <label for="input-direccion" style="display: block; margin-bottom: 5px; color: #ccc;">Dirección de entrega:</label>
                <input type="text" id="input-direccion" placeholder="Ej: Calle Principal #12, La Vega" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #0b0b0b; color: white; margin-bottom: 15px; box-sizing: border-box;">
            </div>

            <button onclick="enviarPedidoWhatsApp()" style="background: #25d366; color: white; border: none; padding: 12px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px;">
                📲 Enviar pedido por WhatsApp
            </button>
        </div>
    </div>

    <script>
        // Script conectado a tu API en Render
        async function cargarProductos() {
            try {
                const response = await fetch('https://dyk-training.onrender.com/productos/');
                const productos = await response.json();
                
                const contenedor = document.getElementById('productos-container');
                contenedor.innerHTML = '';

                if (productos.length === 0) {
                    contenedor.innerHTML = '<p style="color: #888;">No hay productos disponibles por el momento.</p>';
                    return;
                }

                productos.forEach(producto => {
                    const tarjeta = document.createElement('div');
                    tarjeta.style.background = '#161616';
                    tarjeta.style.border = '1px solid #333';
                    tarjeta.style.borderRadius = '8px';
                    tarjeta.style.padding = '15px';
                    tarjeta.style.boxShadow = '0 4px 6px rgba(0,0,0,0.3)';
                    tarjeta.style.display = 'flex';
                    tarjeta.style.flexDirection = 'column';
                    tarjeta.style.justifyContent = 'space-between';
                    
                    tarjeta.innerHTML = `
                        <div>
                            <h3 style="color: #e50914; margin-top: 0;">${producto.nombre}</h3>
                            <p style="color: #ccc; font-size: 0.9rem;">${producto.descripcion}</p>
                            <p style="color: #fff; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px;">$${producto.precio}</p>
                        </div>
                        <button onclick="agregarAlCarrito(${producto.id}, '${producto.nombre}', ${producto.precio})" 
                                style="background: #e50914; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">
                            Agregar al carrito
                        </button>
                    `;
                    contenedor.appendChild(tarjeta);
                });
            } catch (error) {
                console.error("Error al cargar los productos:", error);
                document.getElementById('productos-container').innerHTML = '<p style="color: #e50914;">Error al conectar con el servidor.</p>';
            }
        }

        let carrito = [];

        function agregarAlCarrito(id, nombre, precio) {
            let productoExistente = carrito.find(item => item.id === id);
            if (productoExistente) {
                productoExistente.cantidad += 1;
            } else {
                carrito.push({ id, nombre, precio, cantidad: 1 });
            }
            actualizarCarritoHTML();
        }

        function actualizarCarritoHTML() {
            let listaCarrito = document.getElementById("lista-carrito");
            let totalCarrito = document.getElementById("total-carrito");
            
            if (carrito.length === 0) {
                listaCarrito.innerHTML = "<p style='color: #888;'>El carrito está vacío.</p>";
                totalCarrito.textContent = "0";
                return;
            }
            
            let html = "";
            let total = 0;
            
            carrito.forEach((item, index) => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                html += `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 8px;">
                        <span style="color: #fff;">${item.nombre} (x${item.cantidad})</span>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="color: #bbb;">$${subtotal}</span>
                            <button onclick="eliminarDelCarrito(${index})" style="background: #ff4d4d; border: none; color: white; border-radius: 3px; cursor: pointer; padding: 2px 8px; font-weight: bold;">X</button>
                        </div>
                    </div>
                `;
            });
            
            listaCarrito.innerHTML = html;
            totalCarrito.textContent = total;
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarritoHTML();
        }

        function enviarPedidoWhatsApp() {
            let direccion = document.getElementById("input-direccion").value;
            
            if (carrito.length === 0) {
                alert("El carrito está vacío. Agrega al menos un producto.");
                return;
            }

            if (!direccion.trim()) {
                alert("Por favor, ingresa una dirección de entrega.");
                return;
            }

            let mensaje = "¡Hola! 👋 Quiero hacer el siguiente pedido en D&K Training:\n\n";
            let total = 0;
            
            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                mensaje += `- ${item.nombre} x${item.cantidad} ($${subtotal})\n`;
            });

            mensaje +=` \n*Total a pagar:* $${total}`;
            mensaje += `\n*Dirección de entrega:* ${direccion}`;

            let urlWhatsApp =` https://wa.me/18093270116?text=` + encodeURIComponent(mensaje);
            window.open(urlWhatsApp, '_blank');
        }

        cargarProductos();
    </script>
</body>
</html>
